# OpenNext is automatically selected by Netlify for this Next.js application.
# Do not replace this with a static export or add an SPA catch-all redirect.
[build]
  command = "node scripts/verify-password-reset-offline.mjs && npm run verify:dashboard-loading-behavior && npm run verify:server-loading-guards && npm run verify:dashboard-connection-recovery && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# This authenticated dashboard is published manually from main/Production.
# Preview contexts have no production credentials; do not create promotable
# artifacts that can replace production with an unconfigured login page.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

# Set production runtime secrets/flags in Netlify's UI with Functions scope
# (and Builds where required), never in this tracked file.
