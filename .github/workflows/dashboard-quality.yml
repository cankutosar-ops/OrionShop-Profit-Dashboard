name: Dashboard quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon
      SUPABASE_SERVICE_ROLE_KEY: fixture-service
      INVENTORY_SNAPSHOT_SCHEDULER: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Data and error behavior
        run: |
          node scripts/verify-password-reset-offline.mjs
          npm run verify:dashboard-loading-behavior
          npm run verify:dashboard-connection-recovery
          npm run verify:server-loading-guards
          npm run verify:dashboard-tax
          npm run verify:marketplace-fees
          node --import tsx scripts/verify-tenant-authorization-p0.mjs
          node scripts/verify-nav-regression-6-35-4.mjs
          node scripts/verify-account-switch-ux-6-35-1.mjs
      - name: Marketplace and finance release regressions
        run: |
          node --import tsx scripts/verify-dashboard-brand-finance.mjs
          node --import tsx scripts/verify-finance-2026-weekly-backfill.mjs
          node --import tsx scripts/verify-finance-excel-import.mjs
          node --import tsx scripts/verify-sync-worker.mjs
          node --import tsx scripts/verify-warehouse-sales-reconciliation.mjs
          node --import tsx scripts/verify-warehouse-sales-export.mjs
          node --import tsx scripts/verify-fbs-warehouse-attribution.mjs
      - name: Production build
        run: npm run build
      - name: Compiled app, middleware and HTTP failure paths
        run: npm run verify:dashboard-production
      - name: Single-company Gunay read paths
        run: npm run verify:gunay-release
